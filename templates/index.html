<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROMPT INPUT</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #000000;
            color: #00ff7f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 0;
        }

        .container {
            background-color: #000000;
            border: 1px solid #00ff7f;
            padding: 2rem;
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
        }

        h2 {
            color: #00ff7f;
            margin-top: 0;
            font-size: 1.2rem;
            border-bottom: 1px solid #00ff7f;
            padding-bottom: 0.5rem;
        }

        input[type="text"] {
            width: 100%;
            background-color: #000000;
            color: #00ff7f;
            border: 1px solid #00ff7f;
            padding: 0.5rem;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            margin: 0.5rem 0;
        }

        input[type="submit"] {
            background-color: transparent;
            color: #00ff7f;
            border: 1px solid #00ff7f;
            padding: 0.5rem 1rem;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
            font-size: 1rem;
        }

        input[type="submit"]:hover {
            background-color: #00ff7f;
            color: #000000;
        }

        p.note {
            font-size: 0.8rem;
            color: #00ff7f;
            margin-top: 1rem;
        }

        a {
            color: #00ff7f;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <form action="/prompt" method="POST">
            <h2>ENTER YOUR PROMPT</h2>
            <input type="text" name="prompt" placeholder="> ADD A PROMPT" required>
            <br>
            <input type="submit" value="START BROWSING">
        </form>
        <p class="note">
            NOTE: YOU CAN CHANGE YOUR PROMPT AT ANY TIME BY VISITING <a href="/prompt">/PROMPT</a>
        </p>
    </div>
</body>
</html>
